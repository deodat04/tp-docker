# ============================================================
# CD = Continuous Deployment  ->  DEV (auto) -> PREPROD / PROD (manuel)
# Responsabilité : prendre une image DÉJÀ construite par la CI
# et la faire tourner sur un environnement. AUCUN build ici.
# ============================================================
name: CD

on:
  # AUTOMATIQUE : se déclenche quand le workflow "CI" se termine (sur main)
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # MANUEL : pour promouvoir une version vers preprod / prod (ou rejouer dev)
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        type: choice
        options: [dev, preprod, prod]
      tag:
        description: "Tag de l'image (sha du commit construit par la CI)"
        required: true

env:
  # Tag : celui saisi à la main, sinon le sha du commit que la CI vient de construire
  IMAGE: europe-west1-docker.pkg.dev/cs-poc-hpzdycpiqjyvinhrczvlwcn/metasounds-derrick/metasounds:${{ inputs.tag || github.event.workflow_run.head_sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    # On ne déploie automatiquement que si la CI a RÉUSSI.
    # Un lancement manuel (workflow_dispatch) passe toujours.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    # Manuel -> l'environnement choisi. Automatique -> toujours "dev".
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Déploiement sur la VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: derrick
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
            docker pull ${{ env.IMAGE }}
            docker rm -f metasounds || true
            docker run -p 80:8080 -d --name metasounds ${{ env.IMAGE }}