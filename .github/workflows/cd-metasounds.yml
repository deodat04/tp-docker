# ============================================================
# CD = Continuous Deployment  ->  DEV -> PREPROD -> PROD
# Responsabilité : prendre une image DÉJÀ construite (par la CI)
# et la faire tourner sur un environnement. Ici : AUCUN build.
# ============================================================
name: CD

# Lancement manuel : tu choisis QUOI déployer (tag) et OÙ (environnement)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        type: choice
        options: [dev, preprod, prod]
      tag:
        description: "Tag de l'image (sha du commit construit par la CI)"
        required: true

env:
  IMAGE: europe-west1-docker.pkg.dev/cs-poc-hpzdycpiqjyvinhrczvlwcn/metasounds-derrick/metasounds:${{ inputs.tag }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Lie le job à un "Environment" GitHub (Settings > Environments).
    # Chaque environnement a ses propres secrets (VM_HOST...) et ses règles
    # (ex : validation manuelle obligatoire avant prod).
    environment: ${{ inputs.environment }}

    steps:
      # Le runner se connecte en SSH à la VM, puis exécute les commandes DESSUS.
      - name: Déploiement sur la VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}          # IP de la VM de cet environnement
          username: derrick
          key: ${{ secrets.GCP_SA_KEY }}        # clé privée SSH (secret)
          script: |
            # Autorise Docker (sur la VM) à lire Artifact Registry
            gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

            # PULL : télécharge l'image depuis le registry
            docker pull ${{ env.IMAGE }}

            # Supprime l'ancien conteneur s'il existe (|| true = pas d'erreur sinon)
            docker rm -f metasounds || true

            # RUN : lance la nouvelle version en arrière-plan.
            docker run -p 80:8080 -d --name metasounds ${{ env.IMAGE }}